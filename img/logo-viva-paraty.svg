<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Viva Paraty! Agência de Roteiros">
  <defs>
    <linearGradient id="bgTrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E382C"/>
      <stop offset="55%" stop-color="#145A43"/>
      <stop offset="100%" stop-color="#0A2921"/>
    </linearGradient>
    <linearGradient id="vivaRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DF2F71"/>
      <stop offset="100%" stop-color="#EE4B88"/>
    </linearGradient>
    <linearGradient id="paratyRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C56E"/>
      <stop offset="100%" stop-color="#48DC8A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#061813" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Base circular seal -->
  <circle cx="110" cy="110" r="104" fill="url(#bgTrop)"/>

  <!-- Subtle wave & leaf watermark inside seal -->
  <path d="M 18 145 Q 64 128 110 144 T 202 140 L 202 205 L 18 205 Z" fill="#18765A" opacity="0.28"/>

  <!-- Outer double white stamp rings -->
  <circle cx="110" cy="110" r="98" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.92"/>
  <circle cx="110" cy="110" r="91" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.88"/>

  <!-- Dotted inner stamp ring -->
  <circle cx="110" cy="110" r="82" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.5 9.8" opacity="0.95"/>

  <!-- "Viva" Magenta Ribbon -->
  <g transform="translate(110, 74) rotate(-6)" filter="url(#softShadow)">
    <rect x="-46" y="-21" width="92" height="38" rx="10" fill="url(#vivaRibbon)"/>
    <text x="0" y="7" text-anchor="middle" fill="#FFFFFF" font-family="'Fraunces', 'Georgia', serif" font-weight="800" font-style="italic" font-size="31" letter-spacing="-0.5">Viva</text>
  </g>

  <!-- "Paraty!" Emerald Ribbon + Deep Navy Text -->
  <g transform="translate(110, 115) rotate(-5)" filter="url(#softShadow)">
    <rect x="-68" y="-22" width="136" height="42" rx="11" fill="url(#paratyRibbon)"/>
    <text x="0" y="8" text-anchor="middle" fill="#153278" font-family="'Fraunces', 'Georgia', serif" font-weight="900" font-style="italic" font-size="32" letter-spacing="-0.6">Paraty!</text>
  </g>

  <!-- "Agência de Roteiros" -->
  <text x="110" y="156" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="11.5" letter-spacing="0.8" opacity="0.96">Agência de Roteiros</text>
</svg>
